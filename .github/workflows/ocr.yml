name: 🏂 Code Review

# from: github.com/alibaba/open-code-review/tree/5829539379e/examples/github_actions/ocr-review.yml

# Conditional concurrency group.
#
# GitHub Actions evaluates concurrency BEFORE job-level if-conditions. With a
# flat group (ocr-<pr_number>), every comment on the PR — even an unrelated
# conversation reply that will be skipped — enters the same group and, because
# cancel-in-progress is true, cancels any in-progress review. The result: a
# single normal comment kills a running review, and you see "two runs, one
# cancelled" in the Actions tab.
#
# Fix: matching events (PR events + /open-code-review comments) share a per-PR
# group so a new review cancels any stale one for the same PR. Non-matching
# comments land in a unique noop-<run_id> group that can never collide with a
# real review, so they are skipped instantly without disrupting anything.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
            || startsWith(github.event.comment.body, '@ocr')
            || startsWith(github.event.comment.body, '/ocr')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # Use pull_request_target instead of pull_request so that secrets are
  # available even for PRs from forks. This is safe because the reusable
  # action only reads the diff and does not execute any code from the PR.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: 🏂 OCR
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # Run on PR events, or on human-authored comments starting with trigger
    # keywords. Bot comments are excluded as a safety net: GITHUB_TOKEN already
    # suppresses events from bot-posted comments, but a PAT/App token would not.
    # issue_comment triggers are further gated on author_association so only
    # MEMBER/OWNER/COLLABORATOR users can spend LLM quota via re-review.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
          || startsWith(github.event.comment.body, '@ocr')
          || startsWith(github.event.comment.body, '/ocr')
        )
      )
    steps:
      - name: 🦚 Context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            // A closed PR's base branch may have been deleted, so its name
            // (base.ref) is no longer fetchable; base.sha is the last-known
            // base commit and always resolvable in the repo.
            const isClosed = pullRequest.state === 'closed';
            core.setOutput('is_closed', isClosed ? 'true' : 'false');
            core.setOutput('base_ref', isClosed ? pullRequest.base.sha : pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

        # github.com/alibaba/open-code-review/blob/5829539379e/action.yml
        # github.com/alibaba/open-code-review/tree/5829539379e/examples/github_actions
        # open-codereview.ai/docs/cli-reference

        # The OCR action runs its own checkout, but its "Compute merge-base"
        # step only handles branch-name bases. For a CLOSED PR the base branch
        # may be deleted, so pr-context passes base.sha (a bare 40-hex SHA).
        # `git fetch origin <sha>` only writes FETCH_HEAD (no
        # refs/remotes/origin/<sha>), so the action's
        # `git merge-base origin/<sha> …` fails and falls back to HEAD_SHA →
        # from == to → empty diff. We therefore fetch the objects here and
        # create refs/heads/origin/<sha>, which git's ref DWIM resolution
        # finds for the action's `origin/<sha>` lookup. It survives the
        # action's own checkout: actions/checkout only prunes its fetch
        # refspec destinations (refs/remotes/origin/* and refs/tags/*) and
        # never deletes local branches.
        #
        # Fork PRs: the head may live in a fork (or the fork may have been
        # deleted). A bare-SHA fetch of the head only succeeds if the commit is
        # still reachable from an advertised ref on THIS repo, so we also fetch
        # refs/pull/<n>/head — advertised on the base repo for fork PRs and
        # (per GitHub docs) persistent for inactive/closed PRs. Fetching fork
        # objects into the object DB is safe here: nothing is ever executed,
        # OCR only computes a diff from git objects (same as its own
        # "Fetch PR head (fork-safe)" step). Do NOT "helpfully" check out the
        # head — materializing it would run untrusted filters/hooks in a job
        # that holds secrets. The head is used only as a diff endpoint.
        #
        # Supply-chain hardening: this job holds secrets, so every action here
        # is pinned by full commit SHA (github-script, checkout, and the OCR
        # action itself). First-party actions are pinned too; a mutable tag in
        # a secrets-bearing pull_request_target job is an injection vector.
      - name: ⬇️ Checkout (full history)
        if: github.event_name == 'issue_comment' && steps.pr-context.outputs.is_closed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🌉 Prepare base SHA for closed-PR reviews
        if: github.event_name == 'issue_comment' && steps.pr-context.outputs.is_closed == 'true'
        shell: bash
        env:
          BASE_REF: ${{ steps.pr-context.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr-context.outputs.head_sha }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [[ "${BASE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            # Base commit always lives in this repo.
            git fetch origin "${BASE_REF}" 2>/dev/null || true
            # Head may live in a fork (or the fork may have been deleted).
            # Fetch the PR's pull ref first — it is advertised on THIS repo for
            # fork PRs and persists after close; then the exact head SHA as a
            # fallback/override for same-repo PRs.
            if [ -n "${PR_NUM}" ]; then
              git fetch origin "pull/${PR_NUM}/head" 2>/dev/null || true
            fi
            git fetch origin "${HEAD_SHA}" 2>/dev/null || true
            if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
              echo "::error::base SHA ${BASE_REF} is not fetchable; refusing to run OCR with an empty diff"
              exit 1
            fi
            if git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              echo "Head ${HEAD_SHA} resolved"
            else
              echo "::warning::head SHA ${HEAD_SHA} is not resolved yet; the action's fork-safe fetch will retry it"
            fi

            # Create refs/heads/origin/<sha> so the action's
            # `git merge-base origin/<sha> …` resolves via ref DWIM. No
            # post-checkout hook is needed: actions/checkout only prunes its
            # fetch refspec destinations (refs/remotes/origin/*, tags) and
            # leaves local branches alone.
            git update-ref "refs/heads/origin/${BASE_REF}" "${BASE_REF}"
            echo "Preserved base ${BASE_REF} as refs/heads/origin/${BASE_REF}"
          else
            echo "::warning::is_closed=true but base_ref is not a SHA (${BASE_REF}); skipping materialization"
          fi

      - name: 🐦‍🔥 Review
        uses: alibaba/open-code-review@e78474478f168a8009bd3b12334a87a2c985819d # v1.8.4
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # turn on thinking mode as expected by anthropic api
          llm_extra_body: '${{ vars.OCR_LLM_EXTRA_BODY }}'
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the
          # event automatically:
          # github.com/alibaba/open-code-review/blob/5829539379e/action.yml#L208-L216
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
